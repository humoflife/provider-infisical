apiVersion: project.infisical.upbound.io/v1beta1
kind: Project
metadata:
  annotations:
    meta.upbound.io/example-id: project/v1beta1/project
  labels:
    testing.upbound.io/example-name: gcp-project
  name: gcp-project
spec:
  forProvider:
    description: This is a GCP project
    name: Crossplane GCP Project
    slug: crossplane-gcp-project
---
apiVersion: identity.infisical.upbound.io/v1beta1
kind: Identity
metadata:
  annotations:
    meta.upbound.io/example-id: identity/v1beta1/identity
  labels:
    testing.upbound.io/example-name: universal-auth
  name: crossplane-identity
spec:
  forProvider:
    name: crossplane-identity
    orgId: df92581a-0fe9-42b5-b526-0a1e88ec8085
    role: admin
---
apiVersion: project.infisical.upbound.io/v1beta1
kind: ProjectIdentity
metadata:
  annotations:
    meta.upbound.io/example-id: project/v1beta1/projectidentity
  labels:
    testing.upbound.io/example-name: test-identity
  name: crossplane-project-identity-assignment
spec:
  forProvider:
    identityIdRef:
      name: crossplane-identity
    projectIdRef:
      name: gcp-project
    roles:
      - roleSlug: admin
---
apiVersion: project.infisical.upbound.io/v1beta1
kind: ProjectUser
metadata:
  annotations:
    meta.upbound.io/example-id: project/v1beta1/projectuser
  labels:
    testing.upbound.io/example-name: test-user
  name: test-user
spec:
  forProvider:
    projectIdRef:
      name: gcp-project
    roles:
      - roleSlug: admin
    username: sheen@infisical.com
---
apiVersion: identity.infisical.upbound.io/v1beta1
kind: KubernetesAuth
metadata:
  annotations:
    meta.upbound.io/example-id: identity/v1beta1/kubernetesauth
  labels:
    testing.upbound.io/example-name: test-kubernetes-auth
  name: test-kubernetes-auth
spec:
  forProvider:
    identityIdRef:
      name: crossplane-identity
    kubernetesHost: https://kubernetes.default.svcz
    tokenReviewerJwt: "asdasds"
    allowedNamespaces:
      - default
      - kube-system
---

