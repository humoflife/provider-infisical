apiVersion: identity.infisical.upbound.io/v1beta1
kind: Identity
metadata:
  annotations:
    meta.upbound.io/example-id: identity/v1beta1/identity
  labels:
    testing.upbound.io/example-name: universal-auth
  name: universal-auth
spec:
  forProvider:
    metadata:
    - key: key1
      value: value1
    - key: key2
      value: value2
    name: universal-auth
    orgId: <org_id>
    role: member

---

apiVersion: identity.infisical.upbound.io/v1beta1
kind: AwsAuth
metadata:
  annotations:
    meta.upbound.io/example-id: identity/v1beta1/identity
  labels:
    testing.upbound.io/example-name: aws-auth
  name: aws-auth
spec:
  forProvider:
    accessTokenMaxTtl: 5184000
    accessTokenNumUsesLimit: 3
    accessTokenTtl: 2592000
    allowedAccountIds:
    - "123456789012"
    - "123456789013"
    allowedPrincipalArns:
    - arn:aws:iam::123456789012:user/MyUserName
    identityIdSelector:
      matchLabels:
        testing.upbound.io/example-name: aws-auth

---

apiVersion: identity.infisical.upbound.io/v1beta1
kind: AzureAuth
metadata:
  annotations:
    meta.upbound.io/example-id: identity/v1beta1/identity
  labels:
    testing.upbound.io/example-name: azure-auth
  name: azure-auth
spec:
  forProvider:
    identityIdSelector:
      matchLabels:
        testing.upbound.io/example-name: azure-auth
    tenantId: TENANT_ID

---

apiVersion: identity.infisical.upbound.io/v1beta1
kind: KubernetesAuth
metadata:
  annotations:
    meta.upbound.io/example-id: identity/v1beta1/identity
  labels:
    testing.upbound.io/example-name: k8-auth
  name: k8-auth
spec:
  forProvider:
    allowedNamespaces:
    - namespace-a
    - namespace-b
    identityIdSelector:
      matchLabels:
        testing.upbound.io/example-name: k8-auth
    kubernetesHost: http://example.com
    tokenReviewerJwt: ey<example>

---

apiVersion: identity.infisical.upbound.io/v1beta1
kind: TokenAuth
metadata:
  annotations:
    meta.upbound.io/example-id: identity/v1beta1/identity
  labels:
    testing.upbound.io/example-name: token-auth
  name: token-auth
spec:
  forProvider:
    identityIdSelector:
      matchLabels:
        testing.upbound.io/example-name: token-auth

---

apiVersion: identity.infisical.upbound.io/v1beta1
kind: TokenAuthToken
metadata:
  annotations:
    meta.upbound.io/example-id: identity/v1beta1/identity
  labels:
    testing.upbound.io/example-name: token-auth-token
  name: token-auth-token
spec:
  forProvider:
    identityIdSelector:
      matchLabels:
        testing.upbound.io/example-name: token-auth
    name: token-auth-token

---

apiVersion: identity.infisical.upbound.io/v1beta1
kind: UniversalAuth
metadata:
  annotations:
    meta.upbound.io/example-id: identity/v1beta1/identity
  labels:
    testing.upbound.io/example-name: ua-auth
  name: ua-auth
spec:
  forProvider:
    accessTokenMaxTtl: 5184000
    accessTokenNumUsesLimit: 3
    accessTokenTtl: 2592000
    identityIdSelector:
      matchLabels:
        testing.upbound.io/example-name: universal-auth
