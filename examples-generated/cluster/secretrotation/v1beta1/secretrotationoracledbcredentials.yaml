apiVersion: secretrotation.infisical.upbound.io/v1beta1
kind: SecretRotationOracledbCredentials
metadata:
  annotations:
    meta.upbound.io/example-id: secretrotation/v1beta1/secretrotationoracledbcredentials
  labels:
    testing.upbound.io/example-name: oracledb-credentials
  name: oracledb-credentials
spec:
  forProvider:
    connectionIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    environment: <environment-slug>
    name: oracledb-credentials-secret-rotation-example
    parameters:
      username1: INFISICAL_USER_1
      username2: INFISICAL_USER_2
    projectIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    secretPath: <secret-path>
    secretsMapping:
      password: ORACLEDB_PASSWORD
      username: ORACLEDB_USERNAME
