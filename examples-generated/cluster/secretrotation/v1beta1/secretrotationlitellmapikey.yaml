apiVersion: secretrotation.infisical.upbound.io/v1beta1
kind: SecretRotationLitellmApiKey
metadata:
  annotations:
    meta.upbound.io/example-id: secretrotation/v1beta1/secretrotationlitellmapikey
  labels:
    testing.upbound.io/example-name: litellm-api-key
  name: litellm-api-key
spec:
  forProvider:
    connectionIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    environment: <environment-slug>
    name: litellm-api-key-rotation-example
    parameters:
      additionalOptions: |-
        ${jsonencode({
              max_budget = 100
              tpm_limit  = 10000
              metadata = {
                owner = "platform-team"
              }
            })}
      models:
      - gpt-4o
      - gpt-4o-mini
      name: <litellm-api-key-name>
      teamId: <litellm-team-id>
      userId: <litellm-user-id>
    projectIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    secretPath: <secret-path>
    secretsMapping:
      apiKey: LITELLM_API_KEY
