apiVersion: secretrotation.infisical.upbound.io/v1beta1
kind: SecretRotationDatadogApiKey
metadata:
  annotations:
    meta.upbound.io/example-id: secretrotation/v1beta1/secretrotationdatadogapikey
  labels:
    testing.upbound.io/example-name: datadog-api-key
  name: datadog-api-key
spec:
  forProvider:
    connectionIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    environment: <environment-slug>
    name: datadog-api-key-rotation-example
    parameters:
      name: <datadog-api-key-name>
    projectIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    secretPath: <secret-path>
    secretsMapping:
      apiKey: DATADOG_API_KEY
      apiKeyId: DATADOG_API_KEY_ID
