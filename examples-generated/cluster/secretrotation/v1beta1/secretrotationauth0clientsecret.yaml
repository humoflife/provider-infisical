apiVersion: secretrotation.infisical.upbound.io/v1beta1
kind: SecretRotationAuth0ClientSecret
metadata:
  annotations:
    meta.upbound.io/example-id: secretrotation/v1beta1/secretrotationauth0clientsecret
  labels:
    testing.upbound.io/example-name: auth0-client-secret
  name: auth0-client-secret
spec:
  forProvider:
    connectionId: <app-connection-id>
    environment: <environment-slug>
    name: auth0-client-secret-secret-rotation-example
    parameters:
      clientId: <auth0-application-client-id>
    projectIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    secretPath: <secret-path>
    secretsMapping:
      clientId: AUTH0_CLIENT_ID
      clientSecret: AUTH0_CLIENT_SECRET
