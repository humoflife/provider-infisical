apiVersion: secretrotation.infisical.upbound.io/v1beta1
kind: SecretRotationMysqlCredentials
metadata:
  annotations:
    meta.upbound.io/example-id: secretrotation/v1beta1/secretrotationmysqlcredentials
  labels:
    testing.upbound.io/example-name: mysql-credentials
  name: mysql-credentials
spec:
  forProvider:
    connectionIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    environment: <environment-slug>
    name: mysql-credentials-secret-rotation-example
    parameters:
      username1: infisical_user1
      username2: infisical_user2
    projectIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    secretPath: <secret-path>
    secretsMapping:
      password: MYSQL_PASSWORD
      username: MYSQL_USERNAME
