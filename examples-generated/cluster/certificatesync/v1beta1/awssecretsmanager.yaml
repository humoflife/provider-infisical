apiVersion: certificatesync.infisical.upbound.io/v1beta1
kind: AwsSecretsManager
metadata:
  annotations:
    meta.upbound.io/example-id: certificatesync/v1beta1/awssecretsmanager
  labels:
    testing.upbound.io/example-name: example
  name: example
spec:
  forProvider:
    applicationIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    certificateFilters:
      certificateOrderIds:
      - ${infisical_cert_manager_certificate.example.order_id}
    connectionIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    description: Demo of AWS Secrets Manager certificate sync
    destinationConfig:
      awsRegion: us-east-1
      kmsKeyId: alias/my-secrets-key
    name: aws-secrets-manager-certificate-sync-demo
    syncOptions:
      canRemoveCertificates: true
      certificateNameSchema: infisical-{{certificateId}}
      fieldMappings:
        caCertificate: ca_certificate
        certificate: certificate
        certificateChain: certificate_chain
        privateKey: private_key
      includeRootCa: false
      preserveSecretOnRenewal: true
