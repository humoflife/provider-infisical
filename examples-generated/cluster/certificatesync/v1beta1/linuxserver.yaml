apiVersion: certificatesync.infisical.upbound.io/v1beta1
kind: LinuxServer
metadata:
  annotations:
    meta.upbound.io/example-id: certificatesync/v1beta1/linuxserver
  labels:
    testing.upbound.io/example-name: example
  name: example
spec:
  forProvider:
    applicationIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    certificateFilters:
      certificateOrderIds:
      - ${infisical_cert_manager_certificate.example.order_id}
    connectionId: <ssh-app-connection-id>
    description: Demo of Linux Server certificate sync
    destinationConfig:
      destinationPath: /etc/ssl/infisical
    exportPasswordWoSecretRef:
      key: example-key
      name: example-secret
      namespace: upbound-system
    exportPasswordWoVersion: 1
    name: linux-server-certificate-sync-demo
    syncOptions:
      canRemoveCertificates: true
      certificateNameSchema: '{{commonName}}-{{shortCertificateId}}'
      exportFormat: jks
      fileMode: "0644"
      group: tomcat
      includeTruststore: true
      keystoreAlias: tomcat
      owner: tomcat
      postSyncCommand: systemctl reload tomcat
      privateKeyFileMode: "0600"
