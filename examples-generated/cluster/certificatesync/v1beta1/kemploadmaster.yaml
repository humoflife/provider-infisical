apiVersion: certificatesync.infisical.upbound.io/v1beta1
kind: KempLoadmaster
metadata:
  annotations:
    meta.upbound.io/example-id: certificatesync/v1beta1/kemploadmaster
  labels:
    testing.upbound.io/example-name: example
  name: example
spec:
  forProvider:
    applicationIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    certificateFilters:
      certificateOrderIds:
      - ${infisical_cert_manager_certificate.example.order_id}
    connectionIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    description: Demo of Kemp LoadMaster certificate sync
    destinationConfig:
      virtualServiceId: "1"
    name: kemp-loadmaster-certificate-sync-demo
    syncOptions:
      caCertificateNameSchema: Infisical-ca-{{fingerprint}}
      canRemoveCertificates: true
      certificateNameSchema: Infisical-{{certificateId}}
      includeRootCa: false
      preserveItemOnRenewal: true
