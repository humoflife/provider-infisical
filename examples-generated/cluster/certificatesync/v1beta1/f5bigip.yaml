apiVersion: certificatesync.infisical.upbound.io/v1beta1
kind: F5BigIp
metadata:
  annotations:
    meta.upbound.io/example-id: certificatesync/v1beta1/f5bigip
  labels:
    testing.upbound.io/example-name: example
  name: example
spec:
  forProvider:
    applicationIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    certificateFilters:
      certificateOrderIds:
      - ${infisical_cert_manager_certificate.example.order_id}
    connectionIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    description: Demo of F5 BIG-IP certificate sync
    destinationConfig:
      createProfileIfMissing: true
      parentProfile: /Common/clientssl
      partition: Common
      profileName: infisical-clientssl
      profileType: client-ssl
    name: f5-big-ip-certificate-sync-demo
    syncOptions:
      canRemoveCertificates: true
      certificateNameSchema: Infisical-{{certificateId}}
      includeRootCa: false
      preserveItemOnRenewal: true
