apiVersion: integration.infisical.upbound.io/v1beta1
kind: GcpSecretManager
metadata:
  annotations:
    meta.upbound.io/example-id: integration/v1beta1/gcpsecretmanager
  labels:
    testing.upbound.io/example-name: gcp-integration
  name: gcp-integration
spec:
  forProvider:
    environment: dev
    gcpProjectId: gcp-project-id
    projectIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    secretPath: /
    serviceAccountJsonSecretRef:
      key: example-key
      name: example-secret
      namespace: upbound-system
