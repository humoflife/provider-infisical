apiVersion: integration.infisical.upbound.io/v1beta1
kind: Databricks
metadata:
  annotations:
    meta.upbound.io/example-id: integration/v1beta1/databricks
  labels:
    testing.upbound.io/example-name: db-integration
  name: db-integration
spec:
  forProvider:
    databricksHost: <databricks-host>
    databricksSecretScope: <databricks-secret-scope>
    databricksTokenSecretRef:
      key: example-key
      name: example-secret
      namespace: upbound-system
    environment: <env-slug>
    projectIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    secretPath: /some/infisical/folder
