apiVersion: secretsync.infisical.upbound.io/v1beta1
kind: SecretSyncAwsParameterStore
metadata:
  annotations:
    meta.upbound.io/example-id: secretsync/v1beta1/secretsyncawsparameterstore
  labels:
    testing.upbound.io/example-name: aws-parameter-store-secret-sync
  name: aws-parameter-store-secret-sync
spec:
  forProvider:
    connectionIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    description: Demo of AWS Parameter Store secret sync
    destinationConfig:
      awsRegion: <aws-region>
      path: /example/secrets/
    environment: <environment-slug>
    name: aws-parameter-store-secret-sync-demo
    projectIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    secretPath: <secret-path>
    syncOptions:
      awsKmsKeyId: <aws-kms-key-id>
      initialSyncBehavior: overwrite-destination
      syncSecretMetadataAsTags: false
      tags:
      - key: tag-1
        value: tag-1-value
      - key: tag-2
        value: tag-2-value
