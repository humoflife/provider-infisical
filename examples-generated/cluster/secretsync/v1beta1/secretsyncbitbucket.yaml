apiVersion: secretsync.infisical.upbound.io/v1beta1
kind: SecretSyncBitbucket
metadata:
  annotations:
    meta.upbound.io/example-id: secretsync/v1beta1/secretsyncbitbucket
  labels:
    testing.upbound.io/example-name: example
  name: example
spec:
  forProvider:
    autoSyncEnabled: true
    connectionIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    description: Sync secrets to Bitbucket repository
    destinationConfig:
      environmentId: <bitbucket-environment-slug>
      repositorySlug: <bitbucket-repository-slug>
      workspaceSlug: <bitbucket-workspace-slug>
    environment: <env-slug>
    name: bitbucket-secret-sync
    projectIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    secretPath: <infisical-secret-path>
    syncOptions:
      disableSecretDeletion: false
      initialSyncBehavior: overwrite-destination
      keySchema: '{{secretKey}}-{{environment}}'
