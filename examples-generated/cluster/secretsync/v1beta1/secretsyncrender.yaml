apiVersion: secretsync.infisical.upbound.io/v1beta1
kind: SecretSyncRender
metadata:
  annotations:
    meta.upbound.io/example-id: secretsync/v1beta1/secretsyncrender
  labels:
    testing.upbound.io/example-name: render-secret-sync-demo
  name: render-secret-sync-demo
spec:
  forProvider:
    connectionIdSelector:
      matchLabels:
        testing.upbound.io/example-name: render-app-connection-demo
    description: This is a demo Render Secret Sync.
    destinationConfig:
      scope: <scope>
      serviceId: <service-id>
      type: <type>
    environment: <environment-slug>
    name: render-secret-sync-demo
    projectIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    secretPath: <secret-path>
    syncOptions:
      initialSyncBehavior: <initial-sync-behavior>
      keySchema: <key-schema>

---

apiVersion: appconnection.infisical.upbound.io/v1beta1
kind: AppConnectionRender
metadata:
  annotations:
    meta.upbound.io/example-id: secretsync/v1beta1/secretsyncrender
  labels:
    testing.upbound.io/example-name: render-app-connection-demo
  name: render-app-connection-demo
spec:
  forProvider:
    credentials:
      apiKeySecretRef:
        key: example-key
        name: example-secret
        namespace: upbound-system
    description: This is a demo Render App Connection.
    method: api-key
    name: render-app-connection-demo
