apiVersion: secretsync.infisical.upbound.io/v1beta1
kind: SecretSyncAzureAppConfiguration
metadata:
  annotations:
    meta.upbound.io/example-id: secretsync/v1beta1/secretsyncazureappconfiguration
  labels:
    testing.upbound.io/example-name: app-configuration-demo
  name: app-configuration-demo
spec:
  forProvider:
    connectionIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    description: This is a demo sync
    destinationConfig:
      configurationUrl: <azure-configuration-url>
    environment: dev
    name: demo-sync
    projectIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    secretPath: /
    syncOptions:
      initialSyncBehavior: overwrite-destination
