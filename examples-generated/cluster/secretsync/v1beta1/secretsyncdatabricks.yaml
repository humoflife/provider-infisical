apiVersion: secretsync.infisical.upbound.io/v1beta1
kind: SecretSyncDatabricks
metadata:
  annotations:
    meta.upbound.io/example-id: secretsync/v1beta1/secretsyncdatabricks
  labels:
    testing.upbound.io/example-name: example
  name: example
spec:
  forProvider:
    autoSyncEnabled: true
    connectionIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    description: Sync secrets to Databricks secret scope
    destinationConfig:
      scope: <databricks-secret-scope>
    environment: <env-slug>
    name: databricks-secret-sync
    projectIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    secretPath: <infisical-secret-path>
    syncOptions:
      disableSecretDeletion: false
      initialSyncBehavior: overwrite-destination
      keySchema: '{{secretKey}}-{{environment}}'
