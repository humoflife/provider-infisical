apiVersion: secretsync.infisical.upbound.io/v1beta1
kind: SecretSyncSupabase
metadata:
  annotations:
    meta.upbound.io/example-id: secretsync/v1beta1/secretsyncsupabase
  labels:
    testing.upbound.io/example-name: example
  name: example
spec:
  forProvider:
    autoSyncEnabled: true
    connectionIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    description: Sync secrets to Supabase project
    destinationConfig:
      projectId: <supabase-project-id>
      projectName: <supabase-project-name>
    environment: <env-slug>
    name: supabase-secret-sync
    projectIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    secretPath: <infisical-secret-path>
    syncOptions:
      disableSecretDeletion: false
      initialSyncBehavior: overwrite-destination
      keySchema: '{{secretKey}}-{{environment}}'
