apiVersion: secretsync.infisical.upbound.io/v1beta1
kind: SecretSyncSpacelift
metadata:
  annotations:
    meta.upbound.io/example-id: secretsync/v1beta1/secretsyncspacelift
  labels:
    testing.upbound.io/example-name: example
  name: example
spec:
  forProvider:
    autoSyncEnabled: true
    connectionIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    description: Sync secrets to a Spacelift context
    destinationConfig:
      configType: environment-variable
      contextId: <spacelift-context-id>
      contextName: <spacelift-context-name>
    environment: <env-slug>
    name: spacelift-secret-sync
    projectIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    secretPath: <infisical-secret-path>
    syncOptions:
      disableSecretDeletion: false
      keySchema: '{{secretKey}}_{{environment}}'
      writeOnly: true
