apiVersion: secretsync.infisical.upbound.io/v1beta1
kind: SecretSyncCloudflarePages
metadata:
  annotations:
    meta.upbound.io/example-id: secretsync/v1beta1/secretsynccloudflarepages
  labels:
    testing.upbound.io/example-name: cloudflare-pages-secret-sync
  name: cloudflare-pages-secret-sync
spec:
  forProvider:
    connectionIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    description: Demo of Cloudflare Pages secret sync
    destinationConfig:
      environment: production
      projectName: <cloudflare-pages-project-name>
    environment: <environment-slug>
    name: cloudflare-pages-secret-sync-demo
    projectIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    secretPath: <secret-path>
    syncOptions:
      disableSecretDeletion: false
      initialSyncBehavior: overwrite-destination
      keySchema: <key-schema>
