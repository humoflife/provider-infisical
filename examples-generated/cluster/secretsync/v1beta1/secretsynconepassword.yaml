apiVersion: secretsync.infisical.upbound.io/v1beta1
kind: SecretSyncOnePassword
metadata:
  annotations:
    meta.upbound.io/example-id: secretsync/v1beta1/secretsynconepassword
  labels:
    testing.upbound.io/example-name: one-password-secret-sync-demo
  name: one-password-secret-sync-demo
spec:
  forProvider:
    connectionIdSelector:
      matchLabels:
        testing.upbound.io/example-name: one-password-app-connection-demo
    description: This is a demo 1Password Secret Sync.
    destinationConfig:
      valueLabel: <value-label>
      vaultId: <vault-id>
    environment: <environment-slug>
    name: 1password-secret-sync-demo
    projectIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    secretPath: <secret-path>
    syncOptions:
      initialSyncBehavior: <initial-sync-behavior>
      keySchema: <key-schema>

---

apiVersion: appconnection.infisical.upbound.io/v1beta1
kind: AppConnectionOnePassword
metadata:
  annotations:
    meta.upbound.io/example-id: secretsync/v1beta1/secretsynconepassword
  labels:
    testing.upbound.io/example-name: one-password-app-connection-demo
  name: one-password-app-connection-demo
spec:
  forProvider:
    credentials:
      apiTokenSecretRef:
        key: example-key
        name: example-secret
        namespace: upbound-system
      instanceUrlSecretRef:
        key: example-key
        name: example-secret
        namespace: upbound-system
    description: This is a demo 1Password App Connection.
    method: api-token
    name: 1password-app-connection-demo
