apiVersion: secretsync.infisical.upbound.io/v1beta1
kind: SecretSyncCloudflareWorkers
metadata:
  annotations:
    meta.upbound.io/example-id: secretsync/v1beta1/secretsynccloudflareworkers
  labels:
    testing.upbound.io/example-name: cloudflare-workers-secret-sync
  name: cloudflare-workers-secret-sync
spec:
  forProvider:
    connectionIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    description: Demo of Cloudflare Workers secret sync
    destinationConfig:
      scriptId: <cloudflare-workers-script-id>
    environment: <environment-slug>
    name: cloudflare-workers-secret-sync-demo
    projectIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    secretPath: <secret-path>
    syncOptions:
      disableSecretDeletion: false
      initialSyncBehavior: overwrite-destination
      keySchema: <key-schema>
