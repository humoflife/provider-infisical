apiVersion: appconnection.infisical.upbound.io/v1beta1
kind: AppConnectionHashicorpVault
metadata:
  annotations:
    meta.upbound.io/example-id: appconnection/v1beta1/appconnectionhashicorpvault
  labels:
    testing.upbound.io/example-name: app-connection-vault-access-token
  name: app-connection-vault-access-token
spec:
  forProvider:
    credentials:
      accessTokenSecretRef:
        key: example-key
        name: example-secret
        namespace: upbound-system
      instanceUrl: https://vault.example.com
    description: I am a test app connection
    method: access-token
    name: vault-access-token-app-connection
