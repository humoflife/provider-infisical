apiVersion: appconnection.infisical.upbound.io/v1beta1
kind: AppConnectionBitbucket
metadata:
  annotations:
    meta.upbound.io/example-id: appconnection/v1beta1/appconnectionbitbucket
  labels:
    testing.upbound.io/example-name: example
  name: example
spec:
  forProvider:
    credentials:
      apiTokenSecretRef:
        key: example-key
        name: example-secret
        namespace: upbound-system
      email: your-bitbucket-email@example.com
    description: I am a test app connection
    method: api-token
    name: bitbucket-connection
