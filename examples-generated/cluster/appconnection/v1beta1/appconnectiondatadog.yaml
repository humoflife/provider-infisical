apiVersion: appconnection.infisical.upbound.io/v1beta1
kind: AppConnectionDatadog
metadata:
  annotations:
    meta.upbound.io/example-id: appconnection/v1beta1/appconnectiondatadog
  labels:
    testing.upbound.io/example-name: datadog-demo
  name: datadog-demo
spec:
  forProvider:
    credentials:
      apiKeySecretRef:
        key: example-key
        name: example-secret
        namespace: upbound-system
      applicationKeySecretRef:
        key: example-key
        name: example-secret
        namespace: upbound-system
      url: https://api.datadoghq.com
    description: This is a demo Datadog connection.
    method: api-key
    name: datadog-demo
