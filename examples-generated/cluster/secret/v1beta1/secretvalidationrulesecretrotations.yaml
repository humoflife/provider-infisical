apiVersion: secret.infisical.upbound.io/v1beta1
kind: SecretValidationRuleSecretRotations
metadata:
  annotations:
    meta.upbound.io/example-id: secret/v1beta1/secretvalidationrulesecretrotations
  labels:
    testing.upbound.io/example-name: secret-rotations
  name: secret-rotations
spec:
  forProvider:
    constraints:
      passwordConstraints:
        minLength: 24
      providers:
      - postgres-credentials
      - ldap-password
    environment: dev
    name: secret-rotations-validation-rule-example
    projectIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    secretPath: /**
