apiVersion: secret.infisical.upbound.io/v1beta1
kind: SecretTag
metadata:
  annotations:
    meta.upbound.io/example-id: secret/v1beta1/secrettag
  labels:
    testing.upbound.io/example-name: example
  name: example
spec:
  forProvider:
    color: '#FF0000'
    name: my-tag
    projectIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    slug: my-tag

---

apiVersion: project.infisical.upbound.io/v1beta1
kind: Project
metadata:
  annotations:
    meta.upbound.io/example-id: secret/v1beta1/secrettag
  labels:
    testing.upbound.io/example-name: example
  name: example
spec:
  forProvider:
    name: example
    slug: example
