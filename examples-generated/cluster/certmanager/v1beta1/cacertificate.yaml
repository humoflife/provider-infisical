apiVersion: certmanager.infisical.upbound.io/v1beta1
kind: CaCertificate
metadata:
  annotations:
    meta.upbound.io/example-id: certmanager/v1beta1/cacertificate
  labels:
    testing.upbound.io/example-name: root_cert
  name: root-cert
spec:
  forProvider:
    caIdSelector:
      matchLabels:
        testing.upbound.io/example-name: root
    maxPathLength: 1
    notAfter: "2034-01-01T00:00:00Z"
    notBefore: "2024-01-01T00:00:00Z"

---

apiVersion: certmanager.infisical.upbound.io/v1beta1
kind: InternalCa
metadata:
  annotations:
    meta.upbound.io/example-id: certmanager/v1beta1/cacertificate
  labels:
    testing.upbound.io/example-name: issuing
  name: issuing
spec:
  forProvider:
    commonName: Enterprise Issuing Certificate Authority
    country: US
    keyAlgorithm: RSA_2048
    locality: San Francisco
    name: enterprise-issuing-ca
    organization: Example Corp
    ou: IT Security
    province: California
    type: intermediate

---

apiVersion: certmanager.infisical.upbound.io/v1beta1
kind: InternalCa
metadata:
  annotations:
    meta.upbound.io/example-id: certmanager/v1beta1/cacertificate
  labels:
    testing.upbound.io/example-name: root
  name: root
spec:
  forProvider:
    commonName: Enterprise Root Certificate Authority
    country: US
    keyAlgorithm: RSA_2048
    locality: San Francisco
    name: enterprise-root-ca
    organization: Example Corp
    ou: IT Security
    province: California
    type: root
