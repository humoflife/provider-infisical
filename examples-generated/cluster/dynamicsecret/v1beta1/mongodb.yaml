apiVersion: dynamicsecret.infisical.upbound.io/v1beta1
kind: MongoDb
metadata:
  annotations:
    meta.upbound.io/example-id: dynamicsecret/v1beta1/mongodb
  labels:
    testing.upbound.io/example-name: mongo-db
  name: mongo-db
spec:
  forProvider:
    configuration:
      database: default
      host: your-host
      passwordSecretRef:
        key: example-key
        name: example-secret
        namespace: upbound-system
      port: 27017
      roles:
      - readWrite
      username: your-username
    defaultTtl: 1h
    environmentSlug: dev
    maxTtl: 24h
    name: mongo-db-dynamic-secret-example
    path: /
    projectSlug: your-project-slug
    usernameTemplate: '{{randomUsername}}'
