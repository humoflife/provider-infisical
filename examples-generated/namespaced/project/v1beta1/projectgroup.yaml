apiVersion: project.infisical.m.upbound.io/v1beta1
kind: ProjectGroup
metadata:
  annotations:
    meta.upbound.io/example-id: project/v1beta1/projectgroup
  labels:
    testing.upbound.io/example-name: group
  name: group
  namespace: default
spec:
  forProvider:
    groupIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    groupName: <>
    projectIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    roles:
    - isTemporary: true
      roleSlug: admin
      temporaryAccessStartTime: "2024-09-19T12:43:13Z"
      temporaryRange: 1y
    - roleSlug: my-custom-role

---

apiVersion: project.infisical.m.upbound.io/v1beta1
kind: Project
metadata:
  annotations:
    meta.upbound.io/example-id: project/v1beta1/projectgroup
  labels:
    testing.upbound.io/example-name: example
  name: example
  namespace: default
spec:
  forProvider:
    name: example
    slug: example
