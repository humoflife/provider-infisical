apiVersion: project.infisical.m.upbound.io/v1beta1
kind: ProjectUser
metadata:
  annotations:
    meta.upbound.io/example-id: project/v1beta1/projectuser
  labels:
    testing.upbound.io/example-name: test-user
  name: test-user
  namespace: default
spec:
  forProvider:
    projectIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    roles:
    - roleSlug: admin
    username: <username/email>

---

apiVersion: project.infisical.m.upbound.io/v1beta1
kind: Project
metadata:
  annotations:
    meta.upbound.io/example-id: project/v1beta1/projectuser
  labels:
    testing.upbound.io/example-name: example
  name: example
  namespace: default
spec:
  forProvider:
    name: example
    slug: example
