apiVersion: project.infisical.m.upbound.io/v1beta1
kind: ProjectScopedIdentity
metadata:
  annotations:
    meta.upbound.io/example-id: project/v1beta1/projectscopedidentity
  labels:
    testing.upbound.io/example-name: example
  name: example
  namespace: default
spec:
  forProvider:
    hasDeleteProtection: false
    metadata:
    - key: team
      value: backend
    - key: environment
      value: production
    name: my-project-identity
    projectIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    roles:
    - roleSlug: admin

---

apiVersion: project.infisical.m.upbound.io/v1beta1
kind: Project
metadata:
  annotations:
    meta.upbound.io/example-id: project/v1beta1/projectscopedidentity
  labels:
    testing.upbound.io/example-name: example
  name: example
  namespace: default
spec:
  forProvider:
    name: example
    slug: example
