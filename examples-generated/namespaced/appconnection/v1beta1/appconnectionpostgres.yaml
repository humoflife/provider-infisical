apiVersion: appconnection.infisical.m.upbound.io/v1beta1
kind: AppConnectionPostgres
metadata:
  annotations:
    meta.upbound.io/example-id: appconnection/v1beta1/appconnectionpostgres
  labels:
    testing.upbound.io/example-name: postgres-demo
  name: postgres-demo
  namespace: default
spec:
  forProvider:
    credentials:
      database: default
      host: example.com
      passwordSecretRef:
        key: example-key
        name: example-secret
      port: 5432
      sslEnabled: false
      username: postgres
    description: This is a demo postgres connection.
    method: username-and-password
    name: postgres-demo
