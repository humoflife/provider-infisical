apiVersion: secretsync.infisical.m.upbound.io/v1beta1
kind: SecretSyncGitlab
metadata:
  annotations:
    meta.upbound.io/example-id: secretsync/v1beta1/secretsyncgitlab
  labels:
    testing.upbound.io/example-name: gitlab-project-sync
  name: gitlab-project-sync
  namespace: default
spec:
  forProvider:
    connectionIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    description: Demo of GitLab project secret sync
    destinationConfig:
      projectId: <gitlab-project-id>
      projectName: <gitlab-project-name>
      scope: project
      shouldHideSecrets: false
      shouldMaskSecrets: true
      shouldProtectSecrets: false
      targetEnvironment: '*'
    environment: <environment-slug>
    name: gitlab-project-sync-demo
    projectIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    secretPath: /
    syncOptions:
      disableSecretDeletion: false
      initialSyncBehavior: overwrite-destination
      keySchema: INFISICAL_{{secretKey}}
