apiVersion: secretsync.infisical.m.upbound.io/v1beta1
kind: SecretSyncCircleci
metadata:
  annotations:
    meta.upbound.io/example-id: secretsync/v1beta1/secretsynccircleci
  labels:
    testing.upbound.io/example-name: example
  name: example
  namespace: default
spec:
  forProvider:
    autoSyncEnabled: true
    connectionIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    description: Sync secrets to a CircleCI project
    destinationConfig:
      orgName: <circleci-organization-name>
      projectId: <circleci-project-id>
      projectName: <circleci-project-name>
    environment: <env-slug>
    name: circleci-secret-sync
    projectIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    secretPath: <infisical-secret-path>
    syncOptions:
      disableSecretDeletion: false
      initialSyncBehavior: overwrite-destination
      keySchema: '{{secretKey}}_{{environment}}'
