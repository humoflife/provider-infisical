apiVersion: secretsync.infisical.m.upbound.io/v1beta1
kind: SecretSyncAwsSecretsManager
metadata:
  annotations:
    meta.upbound.io/example-id: secretsync/v1beta1/secretsyncawssecretsmanager
  labels:
    testing.upbound.io/example-name: aws-secrets-manager-secret-sync
  name: aws-secrets-manager-secret-sync
  namespace: default
spec:
  forProvider:
    connectionIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    description: Demo of AWS Secrets Manager secret sync
    destinationConfig:
      awsRegion: <aws-region>
      awsSecretsManagerSecretName: <aws-secret-name>
      mappingBehavior: many-to-one
    environment: <environment-slug>
    name: aws-secrets-manager-secret-sync-demo
    projectIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    secretPath: <secret-path>
    syncOptions:
      awsKmsKeyId: <aws-kms-key-id>
      initialSyncBehavior: overwrite-destination
      syncSecretMetadataAsTags: false
      tags:
      - key: tag-1
        value: tag-1-value
      - key: tag-2
        value: tag-2-value
