apiVersion: secretsync.infisical.m.upbound.io/v1beta1
kind: SecretSyncGcpSecretManager
metadata:
  annotations:
    meta.upbound.io/example-id: secretsync/v1beta1/secretsyncgcpsecretmanager
  labels:
    testing.upbound.io/example-name: secret_manager_test
  name: secret-manager-test
  namespace: default
spec:
  forProvider:
    connectionIdSelector:
      matchLabels:
        testing.upbound.io/example-name: app-connection-gcp
    description: I am a test secret sync
    destinationConfig:
      projectId: my-duplicate-project
      scope: global
    environment: prod
    name: gcp-sync-tests-automatic
    projectIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    secretPath: /
    syncOptions:
      initialSyncBehavior: import-prioritize-destination

---

apiVersion: appconnection.infisical.m.upbound.io/v1beta1
kind: AppConnectionGcp
metadata:
  annotations:
    meta.upbound.io/example-id: secretsync/v1beta1/secretsyncgcpsecretmanager
  labels:
    testing.upbound.io/example-name: app-connection-gcp
  name: app-connection-gcp
  namespace: default
spec:
  forProvider:
    credentials:
      serviceAccountEmailSecretRef:
        key: example-key
        name: example-secret
    description: I am a test app connection
    method: service-account-impersonation
    name: gcp-app-connect
