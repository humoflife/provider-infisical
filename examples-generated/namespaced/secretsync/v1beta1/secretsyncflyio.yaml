apiVersion: secretsync.infisical.m.upbound.io/v1beta1
kind: SecretSyncFlyio
metadata:
  annotations:
    meta.upbound.io/example-id: secretsync/v1beta1/secretsyncflyio
  labels:
    testing.upbound.io/example-name: example
  name: example
  namespace: default
spec:
  forProvider:
    autoSyncEnabled: true
    connectionIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    description: Sync secrets to Fly.io app
    destinationConfig:
      appId: <flyio-app-id>
    environment: <env-slug>
    name: flyio-secret-sync
    projectIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    secretPath: <infisical-secret-path>
    syncOptions:
      disableSecretDeletion: false
      initialSyncBehavior: overwrite-destination
      keySchema: '{{secretKey}}-{{environment}}'
