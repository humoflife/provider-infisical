apiVersion: secret.infisical.m.upbound.io/v1beta1
kind: SecretValidationRuleDynamicSecrets
metadata:
  annotations:
    meta.upbound.io/example-id: secret/v1beta1/secretvalidationruledynamicsecrets
  labels:
    testing.upbound.io/example-name: dynamic-secrets
  name: dynamic-secrets
  namespace: default
spec:
  forProvider:
    constraints:
      passwordConstraints:
        maxLength: 64
        minLength: 24
      providers:
      - sql-database
    environment: dev
    name: dynamic-secrets-validation-rule-example
    projectIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    secretPath: /**
