apiVersion: secret.infisical.m.upbound.io/v1beta1
kind: Secret
metadata:
  annotations:
    meta.upbound.io/example-id: secret/v1beta1/secret
  labels:
    testing.upbound.io/example-name: mongo_secret
  name: mongo-secret
  namespace: default
spec:
  forProvider:
    envSlug: dev
    folderPath: /
    name: MONGO_DB
    valueSecretRef:
      key: example-key
      name: example-secret
    workspaceId: PROJECT_ID

---

apiVersion: secret.infisical.m.upbound.io/v1beta1
kind: SecretTag
metadata:
  annotations:
    meta.upbound.io/example-id: secret/v1beta1/secret
  labels:
    testing.upbound.io/example-name: terraform
  name: terraform
  namespace: default
spec:
  forProvider:
    color: '#fff'
    name: terraform
    projectIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    slug: terraform
