apiVersion: integration.infisical.m.upbound.io/v1beta1
kind: AwsSecretsManager
metadata:
  annotations:
    meta.upbound.io/example-id: integration/v1beta1/awssecretsmanager
  labels:
    testing.upbound.io/example-name: secrets-manager-integration
  name: secrets-manager-integration
  namespace: default
spec:
  forProvider:
    accessKeyIdSecretRef:
      key: example-key
      name: example-secret
    assumeRoleArn: arn:aws:iam::<aws-account-id>:role/<role-name>
    awsRegion: <aws-region>
    environment: <env-slug>
    mappingBehavior: one-to-one
    options:
      awsTags:
      - key: key
        value: value
      secretPrefix: <optional-prefix>
    projectIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    secretAccessKeySecretRef:
      key: example-key
      name: example-secret
    secretPath: <infisical-secrets-path>
    secretsManagerPath: /example/secrets/
