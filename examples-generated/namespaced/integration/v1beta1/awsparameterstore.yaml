apiVersion: integration.infisical.m.upbound.io/v1beta1
kind: AwsParameterStore
metadata:
  annotations:
    meta.upbound.io/example-id: integration/v1beta1/awsparameterstore
  labels:
    testing.upbound.io/example-name: parameter-store-integration
  name: parameter-store-integration
  namespace: default
spec:
  forProvider:
    accessKeyIdSecretRef:
      key: example-key
      name: example-secret
    assumeRoleArn: arn:aws:iam::<aws-account-id>:role/<role-name>
    awsRegion: <aws-region>
    environment: <env-slug>
    options:
      awsTags:
      - key: key
        value: value
      shouldDisableDelete: true
    parameterStorePath: /example/secrets/
    projectIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    secretAccessKeySecretRef:
      key: example-key
      name: example-secret
    secretPath: <infisical-secrets-path>
