apiVersion: integration.infisical.m.upbound.io/v1beta1
kind: Circleci
metadata:
  annotations:
    meta.upbound.io/example-id: integration/v1beta1/circleci
  labels:
    testing.upbound.io/example-name: circleci-integration
  name: circleci-integration
  namespace: default
spec:
  forProvider:
    circleciOrgSlug: <your-circleci-org-slug>
    circleciProjectId: <your-circleci-project-id>
    circleciTokenSecretRef:
      key: example-key
      name: example-secret
    environment: dev
    projectIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    secretPath: /test-folder
