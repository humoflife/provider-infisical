apiVersion: certificatesync.infisical.m.upbound.io/v1beta1
kind: AwsElasticLoadBalancer
metadata:
  annotations:
    meta.upbound.io/example-id: certificatesync/v1beta1/awselasticloadbalancer
  labels:
    testing.upbound.io/example-name: example
  name: example
  namespace: default
spec:
  forProvider:
    applicationIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    certificateFilters:
      certificateOrderIds:
      - ${infisical_cert_manager_certificate.example.order_id}
    connectionIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    defaultCertificateOrderId: ${infisical_cert_manager_certificate.example.order_id}
    description: Demo of AWS Elastic Load Balancer certificate sync
    destinationConfig:
      awsRegion: us-east-1
      listeners:
      - listenerArn: arn:aws:elasticloadbalancing:us-east-1:123456789012:listener/app/my-load-balancer/50dc6c495c0c9188/f2f7dc8efc522ab2
        port: 443
        protocol: HTTPS
      loadBalancerArn: arn:aws:elasticloadbalancing:us-east-1:123456789012:loadbalancer/app/my-load-balancer/50dc6c495c0c9188
    name: aws-elb-certificate-sync-demo
    syncOptions:
      canRemoveCertificates: false
      certificateNameSchema: Infisical-{{certificateId}}
      includeRootCa: false
      preserveArn: true
