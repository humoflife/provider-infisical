apiVersion: secretrotation.infisical.m.upbound.io/v1beta1
kind: SecretRotationAwsIamUserSecret
metadata:
  annotations:
    meta.upbound.io/example-id: secretrotation/v1beta1/secretrotationawsiamusersecret
  labels:
    testing.upbound.io/example-name: aws-iam-user-secret
  name: aws-iam-user-secret
  namespace: default
spec:
  forProvider:
    connectionIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    environment: <environment-slug>
    name: aws-iam-user-secret-rotation-example
    parameters:
      region: <aws-region>
      userName: <aws-iam-user-name>
    projectIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    secretPath: <secret-path>
    secretsMapping:
      accessKeyId: AWS_ACCESS_KEY_ID
      secretAccessKey: AWS_SECRET_ACCESS_KEY
