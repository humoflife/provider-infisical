apiVersion: secretrotation.infisical.m.upbound.io/v1beta1
kind: SecretRotationLdapPassword
metadata:
  annotations:
    meta.upbound.io/example-id: secretrotation/v1beta1/secretrotationldappassword
  labels:
    testing.upbound.io/example-name: example
  name: example
  namespace: default
spec:
  forProvider:
    autoRotationEnabled: true
    connectionIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    description: Rotation for LDAP user passwords
    environment: <environment-slug>
    name: ldap-password-rotation
    parameters:
      dn: CN=John,OU=Users,DC=example,DC=com
      passwordRequirements:
        allowedSymbols: -_.~!*
        length: 48
        required:
          digits: 1
          lowercase: 1
          symbols: 0
          uppercase: 1
      rotationMethod: connection-principal
    projectIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    rotateAtUtc:
      hours: 2
      minutes: 0
    rotationInterval: 30
    secretPath: <secret-path>
    secretsMapping:
      dn: LDAP_DN
      password: LDAP_PASSWORD
