apiVersion: secretrotation.infisical.m.upbound.io/v1beta1
kind: SecretRotationPostgresCredentials
metadata:
  annotations:
    meta.upbound.io/example-id: secretrotation/v1beta1/secretrotationpostgrescredentials
  labels:
    testing.upbound.io/example-name: postgres-credentials
  name: postgres-credentials
  namespace: default
spec:
  forProvider:
    connectionIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    environment: <environment-slug>
    name: postgres-credentials-secret-rotation-example
    parameters:
      username1: infisical_user_1
      username2: infisical_user_2
    projectIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    secretPath: <secret-path>
    secretsMapping:
      password: POSTGRES_DB_PASSWORD
      username: POSTGRES_DB_USERNAME
