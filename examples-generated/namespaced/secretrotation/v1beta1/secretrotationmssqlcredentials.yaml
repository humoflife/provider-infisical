apiVersion: secretrotation.infisical.m.upbound.io/v1beta1
kind: SecretRotationMssqlCredentials
metadata:
  annotations:
    meta.upbound.io/example-id: secretrotation/v1beta1/secretrotationmssqlcredentials
  labels:
    testing.upbound.io/example-name: mssql-credentials
  name: mssql-credentials
  namespace: default
spec:
  forProvider:
    connectionIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    environment: <environment-slug>
    name: mssql-credentials-secret-rotation-example
    parameters:
      username1: infisical_user_1
      username2: infisical_user_2
    projectIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    secretPath: <secret-path>
    secretsMapping:
      password: MSSQL_PASSWORD
      username: MSSQL_USERNAME
