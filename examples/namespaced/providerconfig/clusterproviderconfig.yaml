# A ClusterProviderConfig can be used by namespaced managed resources in any
# namespace. They reference it with kind ClusterProviderConfig.
apiVersion: infisical.m.upbound.io/v1beta1
kind: ClusterProviderConfig
metadata:
  name: default
spec:
  host: http://localhost:8088
  credentials:
    source: Secret
    secretRef:
      name: example-creds
      namespace: crossplane-system
      key: credentials
