# A ProviderConfig is namespaced. Managed resources in the same namespace
# reference it with kind ProviderConfig, and it reads the credentials Secret
# from that namespace.
apiVersion: infisical.m.upbound.io/v1beta1
kind: ProviderConfig
metadata:
  name: default
  namespace: default
spec:
  host: http://localhost:8088
  credentials:
    source: Secret
    secretRef:
      name: example-creds
      key: credentials
